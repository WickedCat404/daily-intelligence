name: Update Daily Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-intelligence-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install updater
        run: pip install -r requirements.txt

      - name: Fetch, cluster and summarize news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          AI_SUMMARY_LIMIT: '6'
        run: python scripts/update_news.py

      - name: Persist generated public data
        run: |
          git config user.name "daily-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh intelligence data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
