name: Update Daily Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-intelligence-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install updater
        run: pip install -r requirements.txt

      - name: Fetch, cluster and summarize news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          AI_SUMMARY_LIMIT: '6'
        run: python scripts/update_news.py

      - name: Persist generated public data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "daily-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the freshly generated data outside the working tree.
          rm -rf /tmp/daily-intelligence-data
          mkdir -p /tmp/daily-intelligence-data
          cp -a docs/data/. /tmp/daily-intelligence-data/

          # Move this runner onto the newest version of main.
          # This preserves manual frontend commits made while the updater ran.
          git fetch origin main
          git reset --hard origin/main

          # Restore only the data generated by this workflow run.
          mkdir -p docs/data
          rm -rf docs/data/*
          cp -a /tmp/daily-intelligence-data/. docs/data/

          git add docs/data

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: refresh intelligence data"

            # A very small race can still occur between fetch and push.
            # Retry by rebasing the data commit onto the newest main.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Generated intelligence data pushed successfully."
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push generated data after 3 attempts."
                exit 1
              fi

              echo "main changed during push. Rebasing and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Sync deployment checkout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
