<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily Intelligence — a signal-first personal news briefing.">
  <meta name="theme-color" content="#f4f5f1">
  <title>Daily Intelligence</title>
  <link rel="stylesheet" href="./styles.css?v=6.1">
</head>
<body>
  <div id="menuOverlay" class="menu-overlay" aria-hidden="true"></div>

  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="sidebar-top">
      <button class="sidebar-brand brand-button" data-view="brief" aria-label="Daily Intelligence home">
        <span class="brand-mark">DI</span>
        <span>
          <span class="brand-name">Daily Intelligence</span>
          <span class="brand-subtitle">Signal over noise</span>
        </span>
      </button>
      <button id="closeMenu" class="icon-button close-menu" aria-label="Close menu">×</button>
    </div>

    <nav class="navigation">
      <div class="nav-group">
        <div class="nav-label">Today</div>
        <button class="nav-item active" data-view="brief"><span class="nav-icon">⌂</span>The Brief</button>
        <button class="nav-item" data-view="since"><span class="nav-icon">↻</span>Since Last Check</button>
        <button class="nav-item" data-view="developing"><span class="nav-icon">◉</span>Developing</button>
      </div>

      <div class="nav-group">
        <div class="nav-label">India</div>
        <button class="nav-item" data-category="India">India</button>
        <button class="nav-item" data-category="Indian Politics">Indian Politics</button>
        <button class="nav-item" data-category="Macro Economics">Economy &amp; Policy</button>
        <button class="nav-item" data-category="Business & Micro">Business</button>
        <button class="nav-item" data-view="markets"><span class="nav-icon">↗</span>Markets</button>
      </div>

      <div class="nav-group">
        <div class="nav-label">World</div>
        <button class="nav-item" data-category="World">World</button>
        <button class="nav-item" data-category="Geopolitics">Geopolitics</button>
        <button class="nav-item" data-category="World Politics">World Politics</button>
      </div>

      <div class="nav-group">
        <div class="nav-label">Tech &amp; Science</div>
        <button class="nav-item" data-category="AI">AI</button>
        <button class="nav-item" data-category="Technology">Technology</button>
        <button class="nav-item" data-category="Science & Climate">Science &amp; Climate</button>
      </div>

      <div class="nav-group">
        <div class="nav-label">More</div>
        <button class="nav-item" data-category="The Ken">The Ken</button>
        <button class="nav-item" data-view="saved">Saved</button>
        <button class="nav-item" data-view="archives">Archives</button>
        <button class="nav-item" data-view="sources">Sources</button>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button id="sidebarThemeButton" class="sidebar-utility" type="button"><span>◐</span><span>Theme</span></button>
      <div class="sidebar-status">
        <span id="sidebarHealthDot" class="status-dot"></span>
        <span id="sidebarStatus">Loading sources…</span>
      </div>
    </div>
  </aside>

  <div class="page-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button id="openMenu" class="icon-button menu-button" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <button class="mobile-brand brand-button" data-view="brief">Daily Intelligence</button>
        <div class="desktop-topbar-copy">
          <span id="topbarDate"></span>
          <span class="topbar-divider">•</span>
          <span id="topbarUpdated">Updating…</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="desktopSearchTrigger" class="search-trigger" type="button"><span>⌕</span><span>Search intelligence</span><kbd>⌘K</kbd></button>
        <button id="searchButton" class="icon-button mobile-search" aria-label="Search">⌕</button>
        <button id="themeButton" class="icon-button" aria-label="Toggle dark mode">◐</button>
      </div>
    </header>

    <div id="searchPanel" class="search-panel hidden">
      <div class="search-inner">
        <span class="search-glyph">⌕</span>
        <input id="searchInput" type="search" placeholder="Search topics, companies, people or countries…" autocomplete="off">
        <button id="closeSearch" class="text-button">Close</button>
      </div>
    </div>

    <main class="main-layout">
      <section class="main-content">
        <header class="brief-header">
          <div>
            <div id="todayDate" class="eyebrow">TODAY</div>
            <h1 id="pageTitle">The Brief</h1>
            <p id="pageDescription" class="page-description">What matters today, without the noise.</p>
          </div>
          <div class="update-status"><span id="healthDot" class="status-dot"></span><span id="lastUpdated">Updating…</span></div>
        </header>

        <section id="sinceLastPanel" class="since-panel">
          <div class="since-icon">↻</div>
          <div class="since-copy">
            <div class="section-kicker">SINCE YOU LAST CHECKED</div>
            <div id="sinceSummary" class="since-summary">Building your catch-up…</div>
          </div>
          <button id="viewSinceButton" class="quiet-button">View changes <span>→</span></button>
        </section>

        <section id="contentView" aria-live="polite">
          <div class="skeleton-stack">
            <div class="skeleton hero-skeleton"></div>
            <div class="skeleton card-skeleton"></div>
            <div class="skeleton card-skeleton"></div>
          </div>
        </section>
      </section>

      <aside id="contextRail" class="context-rail">
        <section id="glancePanel" class="rail-panel">
          <div class="rail-label">AT A GLANCE</div>
          <div id="glanceGrid" class="glance-grid"></div>
        </section>
        <section id="changedPanel" class="rail-panel">
          <div class="rail-label">YOUR CATCH-UP</div>
          <div id="changedSummary" class="rail-copy">Loading…</div>
          <button id="contextSinceButton" class="rail-link">See what changed →</button>
        </section>
        <section id="topicPanel" class="rail-panel">
          <div class="rail-label">EXPLORE</div>
          <div id="topicChips" class="topic-chips"></div>
        </section>
      </aside>
    </main>

    <footer class="footer"><span>Daily Intelligence</span><span>Built for signal, not scroll.</span></footer>
  </div>

  <nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="Mobile navigation">
    <button class="mobile-nav-item active" data-view="brief"><span>⌂</span><small>Brief</small></button>
    <button class="mobile-nav-item" data-view="since"><span>↻</span><small>Since</small></button>
    <button class="mobile-nav-item" data-view="developing"><span>◉</span><small>Live</small></button>
    <button class="mobile-nav-item" data-view="markets"><span>↗</span><small>Markets</small></button>
    <button class="mobile-nav-item" data-view="explore"><span>⊞</span><small>Explore</small></button>
  </nav>

  <div id="sourceSheet" class="sheet hidden" aria-hidden="true">
    <div id="sheetBackdrop" class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div><div class="section-kicker">COVERAGE</div><h3 id="sheetTitle">Sources</h3></div>
        <button id="closeSheet" class="icon-button" aria-label="Close sources">×</button>
      </div>
      <div id="sheetSources" class="sheet-sources"></div>
    </div>
  </div>

  <noscript><div class="noscript">Daily Intelligence requires JavaScript to load the briefing.</div></noscript>
  <script src="./app.js?v=6.1"></script>
</body>
</html>
